<!doctype html>
<html lang="ar" dir="rtl">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <!-- الواجهة فاتحة فقط (متغيّر dark صنفي ولا شيء يفعّله). بلا هذا الإعلان
         تفرض بعض المتصفحات على الجوال تعتيماً تلقائياً: تقلب الخلفيات وتترك
         النصوص المحدَّدة صراحةً كما هي، فيصير النص داكناً على داكن. -->
    <meta name="color-scheme" content="light" />
    <title>Almoaser AI ERP — المعاصر · حساباتك في أمان</title>
    <meta name="description" content="Almoaser AI ERP: منصة SaaS لخدمات مسك الدفاتر والمحاسبة بالذكاء الاصطناعي. وكلاء AI يعملون 24/7 لإدارة فواتيرك وقيودك المحاسبية." />
    <!-- PWA -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/manus-storage/almoaser-icon-180_a01b04c8.png" />
    <meta name="theme-color" content="#22335a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AI ERP" />
    <link rel="manifest" href="/manifest.json" />
    <!-- End PWA -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      تحليلات umami: كانت وسماً ثابتاً، وبما أن VITE_ANALYTICS_ENDPOINT غير معرَّف
      كان النص الحرفي "%VITE_ANALYTICS_ENDPOINT%/umami" يُطلب فيرجع 400 في كل تحميل
      صفحة. الآن لا يُحقن الوسم إلا إذا ضُبط المتغيّران فعلاً.
    -->
    <script type="module">
      const endpoint = import.meta.env.VITE_ANALYTICS_ENDPOINT;
      const websiteId = import.meta.env.VITE_ANALYTICS_WEBSITE_ID;
      if (endpoint && websiteId) {
        const s = document.createElement("script");
        s.defer = true;
        s.src = `${endpoint}/umami`;
        s.dataset.websiteId = websiteId;
        document.body.appendChild(s);
      }
    </script>
  </body>

</html>
